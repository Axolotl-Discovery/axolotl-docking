name: GUI smoke test (Linux/macOS/Windows)

# Verifica rápido que el paquete axd.gui (PySide6) arranca igual en los tres
# sistemas operativos que soporta Qt. No prueba el pipeline de docking en sí
# (eso sigue siendo Linux/WSL-only: smina y ADFRsuite no tienen build de Mac
# en este repo) — sólo que la ventana, las 6 pestañas y los servicios nuevos
# de la GUI (axd/gui/services) importan y corren sin un entorno gráfico real.
on:
  workflow_dispatch:
  push:
    branches: ["refactor/hardware-and-layout"]
    paths:
      - "axd/gui/**"
      - "axd/**.py"
      - "tests/**"
      - ".github/workflows/gui-smoke.yml"
  pull_request:
    paths:
      - "axd/gui/**"
      - "axd/**.py"
      - "tests/**"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # macOS deshabilitado a propósito: consume minutos de Actions a 10× el
        # coste de Linux y esta cuenta no quiere incurrir en ningún gasto por
        # eso. Si hace falta validar algo específico de macOS, hazlo a mano
        # localmente o reactívalo sólo vía workflow_dispatch puntual.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # El runner de ubuntu-latest es una imagen mínima: le faltan las librerías
      # del sistema que Qt 6 (PySide6) necesita hasta para el plugin "offscreen"
      # (libxcb-cursor0 sobre todo, desde Qt 6.5). macOS/Windows no lo necesitan.
      - name: Librerías de sistema para Qt (sólo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libxrender1

      - name: Instalar dependencias (GUI + pytest + lo mínimo que usan las pruebas sin conda)
        run: python -m pip install --upgrade pip pyside6 pytest numpy

      - name: Compilar axd/gui (chequeo de sintaxis)
        shell: bash
        run: python -m compileall -q axd/gui

      - name: Suite de pytest existente (no necesita conda/smina/ADFRsuite)
        run: python -m pytest -q

      - name: Smoke test de la GUI (ventana + 6 pestañas, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_gui.py
